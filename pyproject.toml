[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-kit"
version = "0.1.0"
description = "A provider-neutral, deterministic fixture runner for agent command evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonah Helland" }]
keywords = ["agents", "evaluation", "fixtures", "testing", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jonah-ux/agent-eval-kit"
Repository = "https://github.com/jonah-ux/agent-eval-kit"
Issues = "https://github.com/jonah-ux/agent-eval-kit/issues"

[project.scripts]
agent-eval = "agent_eval_kit.cli:main"
agent-eval-kit = "agent_eval_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_eval_kit = ["demo_fixture.py", "failing_fixture.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
